# Builds all three images on native amd64 (Cloud Build), repo-root context.
# Invoked by build-and-push.sh — local Docker on Apple Silicon produces arm64
# manifests Cloud Run rejects; building remotely sidesteps emulation entirely.
steps:
  - name: "gcr.io/cloud-builders/docker"
    env: ["DOCKER_BUILDKIT=1"]
    args: ["build", "-f", "indexer/Dockerfile",
           "-t", "${_REPO}/ingest:${_TAG}", "."]
  - name: "gcr.io/cloud-builders/docker"
    env: ["DOCKER_BUILDKIT=1"]
    args: ["build", "-f", "api/Dockerfile",
           "-t", "${_REPO}/api:${_TAG}", "."]
  - name: "gcr.io/cloud-builders/docker"
    env: ["DOCKER_BUILDKIT=1"]
    args: ["build", "-f", "packages/app/Dockerfile",
           "--build-arg", "NEXT_PUBLIC_INDEXER_URL=${_INDEXER_URL}",
           "--build-arg", "NEXT_PUBLIC_NETWORK=${_NETWORK}",
           "-t", "${_REPO}/ui:${_TAG}", "."]
images:
  - "${_REPO}/ingest:${_TAG}"
  - "${_REPO}/api:${_TAG}"
  - "${_REPO}/ui:${_TAG}"
options:
  machineType: "E2_HIGHCPU_8"   # rust release builds want cores
timeout: "1800s"
