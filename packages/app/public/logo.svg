<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <!-- Gold coin gradient -->
    <linearGradient id="coinGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFE566"/>
      <stop offset="25%" style="stop-color:#FFD700"/>
      <stop offset="50%" style="stop-color:#FFC125"/>
      <stop offset="75%" style="stop-color:#DAA520"/>
      <stop offset="100%" style="stop-color:#B8860B"/>
    </linearGradient>

    <!-- Inner coin gradient -->
    <linearGradient id="innerGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFD700"/>
      <stop offset="30%" style="stop-color:#FFC125"/>
      <stop offset="70%" style="stop-color:#DAA520"/>
      <stop offset="100%" style="stop-color:#CD950C"/>
    </linearGradient>

    <!-- Shine highlight -->
    <linearGradient id="shineGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:0.6"/>
      <stop offset="50%" style="stop-color:#FFFFFF;stop-opacity:0.1"/>
      <stop offset="100%" style="stop-color:#FFFFFF;stop-opacity:0"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Outer coin edge (darker) -->
  <circle cx="256" cy="256" r="240" fill="#8B7500" filter="url(#shadow)"/>

  <!-- Main coin body -->
  <circle cx="256" cy="256" r="230" fill="url(#coinGradient)"/>

  <!-- Inner coin face -->
  <circle cx="256" cy="256" r="200" fill="url(#innerGradient)"/>

  <!-- Coin rim detail -->
  <circle cx="256" cy="256" r="210" fill="none" stroke="#B8860B" stroke-width="4"/>
  <circle cx="256" cy="256" r="190" fill="none" stroke="#FFE566" stroke-width="2" opacity="0.5"/>

  <!-- Subtle radial lines for coin texture -->
  <g opacity="0.15">
    <line x1="256" y1="66" x2="256" y2="86" stroke="#8B7500" stroke-width="3"/>
    <line x1="256" y1="426" x2="256" y2="446" stroke="#8B7500" stroke-width="3"/>
    <line x1="66" y1="256" x2="86" y2="256" stroke="#8B7500" stroke-width="3"/>
    <line x1="426" y1="256" x2="446" y2="256" stroke="#8B7500" stroke-width="3"/>
  </g>

  <!-- Twemoji Fire emoji (scaled and centered) -->
  <g transform="translate(131, 121) scale(7)">
    <path fill="#F4900C" d="M35 19c0-2.062-.367-4.039-1.04-5.868-.46 5.389-3.333 8.157-6.335 6.868-2.812-1.208-.917-5.917-.777-8.164.236-3.809-.012-8.169-6.931-11.794 2.875 5.5.333 8.917-2.333 9.125-2.958.231-5.667-2.542-4.667-7.042-3.238 2.386-3.332 6.402-2.333 9 1.042 2.708-.042 4.958-2.583 5.208-2.84.28-4.418-3.041-2.963-8.333C2.52 10.965 1 14.805 1 19c0 9.389 7.611 17 17 17s17-7.611 17-17z"/>
    <path fill="#FFCC4D" d="M28.394 23.999c.148 3.084-2.561 4.293-4.019 3.709-2.106-.843-1.541-2.291-2.083-5.291s-2.625-5.083-5.708-6c2.25 6.333-1.247 8.667-3.08 9.084-1.872.426-3.753-.001-3.968-4.007C7.352 23.668 6 26.676 6 30c0 .368.023.73.055 1.09C9.125 34.124 13.342 36 18 36s8.875-1.876 11.945-4.91c.032-.36.055-.722.055-1.09 0-2.187-.584-4.236-1.606-6.001z"/>
  </g>

  <!-- Shine overlay -->
  <ellipse cx="180" cy="180" rx="120" ry="80" fill="url(#shineGradient)" transform="rotate(-30, 180, 180)"/>
</svg>
