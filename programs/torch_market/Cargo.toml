[package]
name = "torch_market"
version = "21.0.0"
description = "torch.market"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "torch_market"

[features]
default = []
# Env-specific build flags. Default (no flag) = mainnet.
# `simnet` and `devnet` lower the lending-unlock threshold for test/dev
# (see constants.rs::MIN_TREASURY_SOL_FOR_LENDING). Exactly one of the
# two may be enabled at a time — a compile_error in constants.rs guards
# the conflict.
simnet = []
devnet = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []


[dependencies]
anchor-lang = { version = "0.32.1", features = ["init-if-needed"] }
anchor-spl = { version = "0.32.1", features = ["token", "associated_token"] }

# DeepPool CPI for DEX migration
deep_pool = { path = "../../../deep_pool/programs/deep_pool", features = ["cpi"] }

[dev-dependencies]
proptest = "1.5"
litesvm = "0.7"
solana-sdk = "2"
solana-program = "2"
borsh = "1.5"
bincode = "1.3"


[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))', 'cfg(feature, values("simnet", "devnet"))'] }
