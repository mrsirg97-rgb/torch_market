services:
  postgres:
    image: postgres:16-alpine
    container_name: torch-indexer-pg
    environment:
      # Superuser creds for ops + init scripts. Indexer does NOT use these.
      POSTGRES_USER: ${POSTGRES_USER:-torch}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      POSTGRES_DB: ${POSTGRES_DB:-torch}
      # Consumed by db/02-indexer-role.sh to create the least-privilege role.
      INDEXER_DB_PASSWORD: ${INDEXER_DB_PASSWORD:?INDEXER_DB_PASSWORD must be set in .env}
      API_DB_PASSWORD: ${API_DB_PASSWORD:?API_DB_PASSWORD must be set in .env}
    ports:
      # Loopback only. Ops access via:
      #   docker exec -it torch-indexer-pg psql -U ${POSTGRES_USER:-torch}
      - "127.0.0.1:5432:5432"
    volumes:
      - torch_pgdata:/var/lib/postgresql/data
      # Init scripts run once, in lexical order, on first volume creation.
      # 01-schema.sql → DDL. 02-indexer-role.sh → least-privilege indexer role.
      - ./db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-torch}"]
      interval: 2s
      timeout: 2s
      retries: 20

  # Indexer only runs when explicitly invoked:
  #   docker compose --profile full up --build
  # Default `docker compose up` starts just Postgres so the dev loop
  # (cargo run from host) stays fast.
  indexer:
    profiles: ["full"]
    build:
      context: .
    container_name: torch-indexer
    env_file:
      # Holds LASERSTREAM_URL, LASERSTREAM_TOKEN, TORCH_PROGRAM_ID,
      # DEEP_POOL_PROGRAM_ID, RPC_URL, optional START_SLOT.
      - path: ./.env
        required: false
    environment:
      # Service-name networking inside the compose network. Indexer connects
      # as the limited `torch_indexer` role, not the superuser.
      DATABASE_URL: postgres://torch_indexer:${INDEXER_DB_PASSWORD}@postgres:5432/${POSTGRES_DB:-torch}
      # Listen on all container interfaces; host port-mapping below scopes
      # external access back to loopback.
      API_BIND: 0.0.0.0:8080
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:8080"
    restart: unless-stopped

volumes:
  torch_pgdata:
